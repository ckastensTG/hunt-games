; Read by the AdMob plugin when exporting for Android: it writes the App ID
; into the manifest (config/AdmobAndroidExportConfig.gd). Without this file
; it would look for an Admob node in the scenes; ours is made in code
; (timeless_core/ads/admob_ad_backend.gd).
;
; The real App ID in every build: debug builds only ever ask for Google's
; demo ad units (TitleConfig.ad_unit), which Google allows, so there's no
; switch to remember before a release. Bagh Chal's; must match TitleConfig
; (tests/test_ads_setup.gd). Jogo da Onça (M3) has its own AdMob app, so
; this file will need to follow the title being exported then.

