; Read by the AdMob plugin when exporting for iOS: it writes the App ID into
; Info.plist as GADApplicationIdentifier (config/AdmobIosExportConfig.gd),
; adds Google's SKAdNetwork IDs, and adds Google's Swift package to the
; Xcode project (Ruby's xcodeproj gem, then xcodebuild).
;
; The real App ID in every build, as on Android (android_export.cfg); debug
; builds only ask for Google's demo ad units. Bagh Chal's; must match
; TitleConfig (tests/test_ads_setup.gd).
;
; ATT is off here on purpose: the tracking prompt's text
; (NSUserTrackingUsageDescription) is already in the iOS export preset's
; additional_plist_content, and the key must not appear twice. The game asks
; for tracking itself (timeless_core/ads/admob_ad_backend.gd).

