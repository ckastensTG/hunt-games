name: core-tests

on:
  push:
  pull_request:

env:
  GODOT_VERSION: 4.7.2-stable

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: core

      - name: Install Godot ${{ env.GODOT_VERSION }}
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}
          zip=Godot_v${GODOT_VERSION}_linux.x86_64.zip
          curl -sSLO "$base/$zip"
          curl -sSLO "$base/SHA512-SUMS.txt"
          grep " $zip\$" SHA512-SUMS.txt | sha512sum -c -
          unzip -q "$zip"
          echo "GODOT=$PWD/Godot_v${GODOT_VERSION}_linux.x86_64" >> "$GITHUB_ENV"

      # The core is an addon, so the tests run inside a throwaway host project.
      - name: Build harness project
        run: |
          mkdir -p harness/addons
          cp -r core harness/addons/timeless_core
          rm -rf harness/addons/timeless_core/.git
          printf 'config_version=5\n[application]\nconfig/name="timeless-core harness"\n' > harness/project.godot

      - name: Run tests
        working-directory: harness
        run: |
          "$GODOT" --headless --path . --import > /dev/null 2>&1 || true
          "$GODOT" --headless --path . -s res://addons/timeless_core/testing/test_runner.gd -- \
            --dir=res://addons/timeless_core/tests
