; EOS client credentials for one title. Copy this file to eos_<title>.cfg
; (e.g. eos_bagh_chal.cfg) and fill in the client from the Epic Developer
; Portal (Product Settings > Clients). The real files are left out of git by
; .gitignore. The product, sandbox and deployment IDs live in
; titles/common/title_config.gd. Exported builds include the real file
; (export preset include filter "config/eos_*.cfg").

